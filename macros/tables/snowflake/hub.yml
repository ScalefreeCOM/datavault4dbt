version: 2

macros:
  - name: snowflake__hub
    description: >
      Snowflake-specific adapter implementation of the hub macro. Called automatically via adapter.dispatch()
      when running on Snowflake. Uses a run_query call to pre-fetch the max load date timestamp for more
      efficient High Water Mark filtering. See the parent hub macro for full parameter documentation.
    arguments:
      - name: hashkey
        type: string
        description: >
          Name of the hashkey column inside the stage, that should be used as PK of the Hub.
      - name: business_keys
        type: string | list of strings
        description: >
          Name(s) of the business key columns that should be loaded into the hub.
      - name: source_models
        type: dictionary
        description: >
          Dictionary with information about the source models, including 'bk_columns', 'hk_column',
          and 'rsrc_static' per source.
      - name: src_ldts
        type: string
        description: >
          Name of the ldts column inside the source models. Optional, defaults to 'datavault4dbt.ldts_alias'.
      - name: src_rsrc
        type: string
        description: >
          Name of the rsrc column inside the source models. Optional, defaults to 'datavault4dbt.rsrc_alias'.
      - name: disable_hwm
        type: boolean
        description: >
          Whether the High Water Mark should be turned off. Optional, default False.
      - name: additional_columns
        type: list | string
        description: >
          Additional columns to include in the Hub. Optional, defaults to empty list.
