version: 2

macros:
  - name: oracle__sat_v1
    description: >
      Oracle-specific adapter implementation of the sat_v1 macro. Called automatically via adapter.dispatch()
      when running on Oracle. See the parent sat_v1 macro for full parameter documentation.
    arguments:
      - name: sat_v0
        type: string
        description: Name of the underlying version 0 satellite.
      - name: hashkey
        type: string
        description: Name of the parent hashkey column inside the version 0 satellite.
      - name: hashdiff
        type: string
        description: Name of the hashdiff column inside the version 0 satellite.
      - name: src_ldts
        type: string
        description: Name of the ldts column. Optional, defaults to 'datavault4dbt.ldts_alias'.
      - name: src_rsrc
        type: string
        description: Name of the rsrc column. Optional, defaults to 'datavault4dbt.rsrc_alias'.
      - name: ledts_alias
        type: string
        description: Desired alias for the load end date column. Optional, defaults to 'datavault4dbt.ledts_alias'.
      - name: add_is_current_flag
        type: boolean
        description: Whether to add an is_current flag derived from the ledts column. Optional, default False.
      - name: include_payload
        type: boolean
        description: Whether to include the payload columns from sat v0. Optional, default True.
