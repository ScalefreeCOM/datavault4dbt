version: 2

macros:
  - name: oracle__ref_hub
    description: >
      Oracle-specific adapter implementation of the ref_hub macro. Called automatically via adapter.dispatch()
      when running on Oracle. See the parent ref_hub macro for full parameter documentation.
    arguments:
      - name: ref_keys
        type: string | list of strings
        description: Name of the reference key(s) available in the source model(s).
      - name: src_ldts
        type: string
        description: Name of the ldts column. Optional, defaults to 'datavault4dbt.ldts_alias'.
      - name: src_rsrc
        type: string
        description: Name of the rsrc column. Optional, defaults to 'datavault4dbt.rsrc_alias'.
      - name: source_models
        type: dictionary
        description: Dictionary with information about the source models.
      - name: additional_columns
        type: list | string
        description: Additional columns to include. Optional, defaults to empty list.
