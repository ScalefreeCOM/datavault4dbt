version: 2

macros:
  - name: exasol__pit
    description: >
      Exasol-specific adapter implementation of the pit macro. Called automatically via adapter.dispatch()
      when running on Exasol. See the parent pit macro for full parameter documentation.
    arguments:
      - name: pit_type
        type: string
        description: String to insert into the 'pit_type' column, prefixed by !. Optional.
      - name: tracked_entity
        type: string
        description: Name of the tracked Hub entity.
      - name: hashkey
        type: string
        description: Name of the hashkey column inside the tracked Hub.
      - name: sat_names
        type: list of strings
        description: List of all satellite names to include in this PIT table.
      - name: ldts
        type: string
        description: Name of the ldts column. Optional, defaults to 'datavault4dbt.ldts_alias'.
      - name: sdts
        type: string
        description: Name of the snapshot date timestamp column. Optional, defaults to 'datavault4dbt.sdts_alias'.
      - name: custom_rsrc
        type: string
        description: Custom string to insert into the rsrc column. Optional.
      - name: ledts
        type: string
        description: Name of the load-end-date column. Optional, defaults to 'datavault4dbt.ledts_alias'.
      - name: snapshot_relation
        type: string
        description: Name of the snapshot relation model.
      - name: snapshot_trigger_column
        type: string
        description: Name of the boolean column that identifies active snapshots.
      - name: dimension_key
        type: string
        description: Desired name of the dimension key inside the PIT table.
      - name: refer_to_ghost_records
        type: boolean
        description: Whether a NULL satellite hashkey should be replaced by the unknown key. Optional, default True.
      - name: snapshot_optimization
        type: boolean
        description: Whether to apply snapshot optimization logic. Optional, default False.
