version: 2

macros:
  - name: exasol__ref_sat_v1
    description: >
      Exasol-specific adapter implementation of the ref_sat_v1 macro. Called automatically via adapter.dispatch()
      when running on Exasol. See the parent ref_sat_v1 macro for full parameter documentation.
    arguments:
      - name: ref_sat_v0
        type: string
        description: Name of the underlying ref_sat_v0 dbt model.
      - name: ref_keys
        type: string | list of strings
        description: Name(s) of the reference key(s) in the underlying reference sat v0.
      - name: hashdiff
        type: string
        description: Name of the Hashdiff column in the underlying reference sat v0.
      - name: src_ldts
        type: string
        description: Name of the ldts column. Optional, defaults to 'datavault4dbt.ldts_alias'.
      - name: src_rsrc
        type: string
        description: Name of the rsrc column. Optional, defaults to 'datavault4dbt.rsrc_alias'.
      - name: ledts_alias
        type: string
        description: Desired alias for the load end date column. Optional, defaults to 'datavault4dbt.ledts_alias'.
      - name: add_is_current_flag
        type: boolean
        description: Whether to add an is_current flag. Optional, default False.
