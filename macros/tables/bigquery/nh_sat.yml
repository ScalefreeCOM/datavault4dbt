version: 2

macros:
  - name: default__nh_sat
    description: >
      Default implementation of the nh_sat macro, co-located in the bigquery adapter folder as BigQuery uses
      this fallback via adapter.dispatch(). See the parent nh_sat macro for full parameter documentation.
    arguments:
      - name: parent_hashkey
        type: string
        description: Name of the hashkey column of the parent hub or link.
      - name: src_payload
        type: list of strings
        description: List of descriptive attribute columns for this non-historized satellite.
      - name: src_ldts
        type: string
        description: Name of the ldts column. Optional, defaults to 'datavault4dbt.ldts_alias'.
      - name: src_rsrc
        type: string
        description: Name of the rsrc column. Optional, defaults to 'datavault4dbt.rsrc_alias'.
      - name: source_model
        type: string
        description: Name of the underlying staging model.
      - name: source_is_single_batch
        type: boolean
        description: Whether the source contains only one batch. Optional, default False.
      - name: additional_columns
        type: list | string
        description: Additional columns to include. Optional, defaults to empty list.
