version: 2

macros:
  - name: control_snap_v1
    description: '{{ doc("control_snap_v1") }}'
    arguments:
      - name: yaml_metadata
        type: string
        description: >
          Optional. A YAML-formatted string that defines all parameters in a single block instead
          of specifying each one directly in the macro call.
      - name: control_snap_v0
        type: string
        description: >
          The name of the underlying version 0 control snapshot table. Needs to be available as a dbt model.
      - name: log_logic
        type: dict[string, any]
        description: >
          Defining the desired durations of each granularity. Available granularities are 'daily', 'weekly',
          'monthly', and 'yearly'. For each granularity the duration can be defined as an integer and the time
          unit for that duration (e.g. DAY, WEEK, MONTH, QUARTER, YEAR in BigQuery). A granularity can also be
          set to 'forever'. If log_logic is not set, no logic will be applied and all snapshots will stay active.
          The duration is always counted from the current date.
          EXASOL: Due to a missing 'DAY OF WEEK' function, 'weekly' is not supported and must be left out.
          Example: {'daily': {'duration': 3, 'unit': 'MONTH'}, 'weekly': {'duration': 1, 'unit': 'YEAR'},
          'monthly': {'duration': 5, 'unit': 'YEAR'}, 'yearly': {'forever': 'TRUE'}}.
      - name: sdts_alias
        type: string
        description: >
          Defines the name of the snapshot date timestamp column inside the snapshot_table. It is optional,
          if not set will use the global variable 'datavault4dbt.sdts_alias' set inside dbt_project.yml.

  - name: snowflake__control_snap_v1
    description: Snowflake-specific implementation of control_snap_v1. Accepts the same arguments as the parent control_snap_v1 macro.

  - name: databricks__control_snap_v1
    description: Databricks-specific implementation of control_snap_v1. Accepts the same arguments as the parent control_snap_v1 macro.

  - name: exasol__control_snap_v1
    description: Exasol-specific implementation of control_snap_v1. Accepts the same arguments as the parent control_snap_v1 macro.

  - name: fabric__control_snap_v1
    description: Microsoft Fabric-specific implementation of control_snap_v1. Accepts the same arguments as the parent control_snap_v1 macro.

  - name: oracle__control_snap_v1
    description: Oracle-specific implementation of control_snap_v1. Accepts the same arguments as the parent control_snap_v1 macro.

  - name: postgres__control_snap_v1
    description: PostgreSQL-specific implementation of control_snap_v1. Accepts the same arguments as the parent control_snap_v1 macro.

  - name: redshift__control_snap_v1
    description: Amazon Redshift-specific implementation of control_snap_v1. Accepts the same arguments as the parent control_snap_v1 macro.

  - name: sqlserver__control_snap_v1
    description: SQL Server-specific implementation of control_snap_v1. Accepts the same arguments as the parent control_snap_v1 macro.

  - name: synapse__control_snap_v1
    description: Azure Synapse Analytics-specific implementation of control_snap_v1. Accepts the same arguments as the parent control_snap_v1 macro.

  - name: trino__control_snap_v1
    description: Trino-specific implementation of control_snap_v1. Accepts the same arguments as the parent control_snap_v1 macro.

  - name: bigquery__control_snap_v1
    description: BigQuery-specific implementation of control_snap_v1. Accepts the same arguments as the parent control_snap_v1 macro.
