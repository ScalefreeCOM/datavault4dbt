version: 2

macros:
  - name: fabric__nh_link
    description: >
      Microsoft Fabric-specific adapter implementation of the nh_link macro. Called automatically via
      adapter.dispatch() when running on Fabric. See the parent nh_link macro for full parameter documentation.
    arguments:
      - name: link_hashkey
        type: string
        description: Name of the non-historized link hashkey column inside the stage.
      - name: payload
        type: list of strings
        description: List of descriptive attribute columns forming the payload.
      - name: foreign_hashkeys
        type: list of strings
        description: List of all hashkey columns inside the link that refer to other hub entities.
      - name: src_ldts
        type: string
        description: Name of the ldts column. Optional, defaults to 'datavault4dbt.ldts_alias'.
      - name: src_rsrc
        type: string
        description: Name of the rsrc column. Optional, defaults to 'datavault4dbt.rsrc_alias'.
      - name: source_models
        type: dictionary
        description: Dictionary with information about the source models.
      - name: disable_hwm
        type: boolean
        description: Whether the High Water Mark should be turned off. Optional, default False.
      - name: source_is_single_batch
        type: boolean
        description: Whether the source contains only one batch. Optional, default False.
      - name: union_strategy
        type: "'all' | 'distinct'"
        description: Defines how multiple sources should be unioned. Default 'all'.
      - name: additional_columns
        type: list | string
        description: Additional columns to include. Optional, defaults to empty list.
