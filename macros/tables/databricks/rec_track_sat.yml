version: 2

macros:
  - name: databricks__rec_track_sat
    description: >
      Databricks-specific adapter implementation of the rec_track_sat macro. Called automatically via
      adapter.dispatch() when running on Databricks. See the parent rec_track_sat macro for full parameter
      documentation.
    arguments:
      - name: tracked_hashkey
        type: string
        description: The name of the hashkey column you want to track.
      - name: source_models
        type: dictionary
        description: Dictionary with source model information, including 'rsrc_static' and optionally 'hk_column'.
      - name: src_ldts
        type: string
        description: Name of the ldts column. Optional, defaults to 'datavault4dbt.ldts_alias'.
      - name: src_rsrc
        type: string
        description: Name of the rsrc column. Optional, defaults to 'datavault4dbt.rsrc_alias'.
      - name: src_stg
        type: string
        description: Name of the source stage model. Optional, defaults to 'datavault4dbt.stg_alias'.
      - name: disable_hwm
        type: boolean
        description: Whether the High Water Mark should be turned off. Optional, default False.
      - name: additional_columns
        type: list | string
        description: Additional columns to include. Optional, defaults to empty list.
