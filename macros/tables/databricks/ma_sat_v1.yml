version: 2

macros:
  - name: databricks__ma_sat_v1
    description: >
      Databricks-specific adapter implementation of the ma_sat_v1 macro. Called automatically via adapter.dispatch()
      when running on Databricks. See the parent ma_sat_v1 macro for full parameter documentation.
    arguments:
      - name: sat_v0
        type: string
        description: Name of the underlying version 0 multi-active satellite.
      - name: hashkey
        type: string
        description: Name of the parent hashkey column inside the version 0 satellite.
      - name: hashdiff
        type: string
        description: Name of the hashdiff column inside the version 0 satellite.
      - name: ma_attribute
        type: string | list of strings
        description: Name of the multi-active attribute(s) in the v0 satellite.
      - name: src_ldts
        type: string
        description: Name of the ldts column. Optional, defaults to 'datavault4dbt.ldts_alias'.
      - name: src_rsrc
        type: string
        description: Name of the rsrc column. Optional, defaults to 'datavault4dbt.rsrc_alias'.
      - name: ledts_alias
        type: string
        description: Desired alias for the load end date column. Optional, defaults to 'datavault4dbt.ledts_alias'.
      - name: add_is_current_flag
        type: boolean
        description: Whether to add an is_current flag derived from the ledts column. Optional, default False.
