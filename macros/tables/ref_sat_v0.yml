version: 2

macros:
  - name: ref_sat_v0
    description: '{{ doc("ref_sat_v0") }}'
    arguments:
      - name: yaml_metadata
        type: dict
        description: >
          Optional. A YAML metadata block that passes all parameters as a single dictionary instead
          of specifying each one directly in the macro call.
      - name: parent_ref_keys
        type: Any
        description: >
          Name of the reference key(s) of the parent ref_hub.
      - name: src_hashdiff
        type: string
        description: >
          Name of the hashdiff column of this ref satellite, that was created inside the staging area and is
          calculated out of the entire payload of this ref satellite. The stage must hold one hashdiff per
          ref satellite entity.
          Examples: 'hd_nation_sfdc_rs' — hashdiff column of the ref satellite for nation.
      - name: src_payload
        type: list
        description: >
          A list of all the descriptive attributes that should be included in this ref satellite. Needs to be the
          columns that are fed into the hashdiff calculation of this ref satellite.
          Examples: ['name', 'continent', 'area'].
      - name: source_model
        type: string
        description: >
          Name of the underlying staging model, must be available inside dbt as a model.
          Examples: 'stage_nation' — This ref satellite is loaded out of the stage for account.
      - name: src_ldts
        type: string
        description: >
          Name of the ldts column inside the source models. Is optional, will use the global variable 'datavault4dbt.ldts_alias'.
          Needs to use the same column name as defined as alias inside the staging model.
      - name: src_rsrc
        type: string
        description: >
          Name of the rsrc column inside the source models. Is optional, will use the global variable 'datavault4dbt.rsrc_alias'.
          Needs to use the same column name as defined as alias inside the staging model.
      - name: disable_hwm
        type: bool
        description: >
          Whether the High Water Mark should be turned off. Optional, default False.
      - name: source_is_single_batch
        type: bool
        description: >
          Whether the source contains only one batch. Optional, default False.
      - name: additional_columns
        type: Any
        description: >
          Additional columns from source system or derived columns which should be part of the ref_sat.
          The columns need to be available in all source models. Optional parameter, defaults to empty list.

  - name: snowflake__ref_sat_v0
    description: Snowflake-specific implementation of ref_sat_v0. Accepts the same arguments as the parent ref_sat_v0 macro.

  - name: databricks__ref_sat_v0
    description: Databricks-specific implementation of ref_sat_v0. Accepts the same arguments as the parent ref_sat_v0 macro.

  - name: exasol__ref_sat_v0
    description: Exasol-specific implementation of ref_sat_v0. Accepts the same arguments as the parent ref_sat_v0 macro.

  - name: fabric__ref_sat_v0
    description: Microsoft Fabric-specific implementation of ref_sat_v0. Accepts the same arguments as the parent ref_sat_v0 macro.

  - name: oracle__ref_sat_v0
    description: Oracle-specific implementation of ref_sat_v0. Accepts the same arguments as the parent ref_sat_v0 macro.

  - name: postgres__ref_sat_v0
    description: PostgreSQL-specific implementation of ref_sat_v0. Accepts the same arguments as the parent ref_sat_v0 macro.

  - name: redshift__ref_sat_v0
    description: Amazon Redshift-specific implementation of ref_sat_v0. Accepts the same arguments as the parent ref_sat_v0 macro.

  - name: sqlserver__ref_sat_v0
    description: SQL Server-specific implementation of ref_sat_v0. Accepts the same arguments as the parent ref_sat_v0 macro.

  - name: synapse__ref_sat_v0
    description: Azure Synapse Analytics-specific implementation of ref_sat_v0. Accepts the same arguments as the parent ref_sat_v0 macro.

  - name: trino__ref_sat_v0
    description: Trino-specific implementation of ref_sat_v0. Accepts the same arguments as the parent ref_sat_v0 macro.

  - name: default__ref_sat_v0
    description: >
      Default implementation of ref_sat_v0, co-located in the BigQuery adapter folder as BigQuery uses this fallback
      via adapter.dispatch(). Accepts the same arguments as the parent ref_sat_v0 macro.
