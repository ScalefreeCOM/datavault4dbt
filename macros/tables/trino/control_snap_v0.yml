version: 2

macros:
  - name: trino__control_snap_v0
    description: >
      Trino-specific adapter implementation of the control_snap_v0 macro. Called automatically via
      adapter.dispatch() when running on Trino. See the parent control_snap_v0 macro for full parameter
      documentation.
    arguments:
      - name: start_date
        type: timestamp
        description: Earliest timestamp for the snapshot table. Time part must be '00:00:00'.
      - name: daily_snapshot_time
        type: time
        description: Time that daily snapshots should have (e.g. '07:00:00').
      - name: sdts_alias
        type: string
        description: Name of the snapshot date timestamp column. Optional, defaults to 'datavault4dbt.sdts_alias'.
      - name: end_date
        type: timestamp
        description: Latest timestamp for the snapshot table. Optional.
