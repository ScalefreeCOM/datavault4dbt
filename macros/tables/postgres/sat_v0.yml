version: 2

macros:
  - name: postgres__sat_v0
    description: >
      PostgreSQL-specific adapter implementation of the sat_v0 macro. Called automatically via adapter.dispatch()
      when running on PostgreSQL. Uses a subquery-based approach for intra-batch deduplication.
      See the parent sat_v0 macro for full parameter documentation.
    arguments:
      - name: parent_hashkey
        type: string
        description: Name of the hashkey column of the parent hub or link.
      - name: src_hashdiff
        type: string
        description: Name of the hashdiff column for this satellite.
      - name: src_payload
        type: list of strings
        description: List of descriptive attribute columns that form the satellite payload.
      - name: source_model
        type: string
        description: Name of the underlying staging model.
      - name: src_ldts
        type: string
        description: Name of the ldts column. Optional, defaults to 'datavault4dbt.ldts_alias'.
      - name: src_rsrc
        type: string
        description: Name of the rsrc column. Optional, defaults to 'datavault4dbt.rsrc_alias'.
      - name: disable_hwm
        type: boolean
        description: Whether the High Water Mark should be turned off. Optional, default False.
      - name: source_is_single_batch
        type: boolean
        description: Whether the source contains only one batch. Skips deduplication subquery. Optional, default False.
      - name: additional_columns
        type: list | string
        description: Additional columns to include. Optional, defaults to empty list.
